<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The International Coalition for Human Rights (ICHR)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom utility for dropdown animation */
      .group:hover .group-hover\:visible {
        visibility: visible;
        opacity: 1;
        transform: translateY(0);
      }
      /* Map container fix */
      .leaflet-container {
        z-index: 0;
        font-family: 'Inter', sans-serif;
      }
      
      /* Professional Popup Styling */
      .custom-popup .leaflet-popup-content-wrapper {
        border-radius: 0.75rem; /* rounded-xl */
        padding: 0;
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); /* shadow-xl */
        border: 1px solid #f1f5f9; /* slate-100 */
      }
      .custom-popup .leaflet-popup-content {
        margin: 0;
        width: auto !important;
      }
      .custom-popup .leaflet-popup-tip {
        background: white;
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      }
      /* Hide default close button as we are using a clean custom UI or click-outside */
      .custom-popup .leaflet-popup-close-button {
        display: none; 
      }

      /* Marker Animation */
      @keyframes markerDropIn {
        0% {
          opacity: 0;
          transform: translateY(-20px) scale(0.9);
        }
        60% {
          opacity: 1;
          transform: translateY(5px) scale(1.05);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .marker-animate-drop {
        animation: markerDropIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
    </style>
